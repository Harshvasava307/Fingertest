<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Game</title>
    <link rel="stylesheet" href="typingtest.css">
    <script src="typingp2min.js" defer></script>
</head>

<center>
    <tr>
        <th>
            <div class="wrapper">
                <input type="text" class="input-field">
                <div class="content-box">
                    <div class="typing-text">
                        <p id="paragraph"></p>
                    </div>
                    <div class="content">
                        <ul class="result-details">
                            <li class="time">
                                <p>
                                    Time Left:
                                </p>
                                <span><b>120</b>s</span>
                            </li>
                            <li class="mistake">
                                <p>
                                    Mistakes:
                                </p>
                                <span>0</span>
                            </li>
                            <li class="wpm">
                                <p>
                                    WPM:
                                </p>
                                <span>0</span>
                            </li>
                            <li class="cpm">
                                <p>
                                    CPM:
                                </p>
                                <span>0</span>
                            </li>
                        </ul>
                        <button>Try Again</button>
                    </div>
                </div>
            </div>
            <br>
            <br>
            <table class="table" width=20%>
                <tr>
                    <th>
                        <a href="typingtestp1min.html" div class=links2>1 Minutes</a> &nbsp;||&nbsp;
                        <a href="typingtestp3min.html" div class=links2>3 Minutes</a> &nbsp;||&nbsp;
                        <a href="typingtestp5min.html" div class=links2>5 Minute</a>
                    </th>
                </tr>
            </table>
</center>
