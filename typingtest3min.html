<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Minute Test | Finger_Test</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="nav" data-testid="main-navigation">
        <a href="Index.html" class="nav-logo" data-testid="nav-logo">
            Finger<span>_Test</span>
        </a>
        <ul class="nav-links">
            <li><a href="Index.html" data-testid="nav-home">Home</a></li>
            <li><a href="credits.html" data-testid="nav-credits">Credits</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="test-container" data-testid="test-container">
        <!-- Test Header -->
        <div class="test-header">
            <div class="test-mode-badge" data-testid="test-mode-badge">
                <i class="fas fa-stopwatch"></i>
                <span>3 Minutes • Standard Mode</span>
            </div>
        </div>

        <!-- Typing Wrapper -->
        <div class="wrapper glass-card" data-testid="typing-wrapper">
            <input type="text" class="input-field" data-testid="typing-input" autocomplete="off">
            <div class="content-box" data-testid="content-box">
                <div class="typing-text" data-testid="typing-text">
                    <p id="paragraph"></p>
                </div>
                <div class="content">
                    <ul class="result-details" data-testid="result-details">
                        <li class="time" data-testid="stat-time">
                            <p>Time Left</p>
                            <span><b>180</b>s</span>
                        </li>
                        <li class="mistake" data-testid="stat-mistakes">
                            <p>Mistakes</p>
                            <span>0</span>
                        </li>
                        <li class="wpm" data-testid="stat-wpm">
                            <p>WPM</p>
                            <span>0</span>
                        </li>
                        <li class="cpm" data-testid="stat-cpm">
                            <p>CPM</p>
                            <span>0</span>
                        </li>
                    </ul>
                    <button class="btn" data-testid="try-again-btn">
                        <i class="fas fa-redo"></i> Try Again
                    </button>
                </div>
            </div>
        </div>

        <!-- Mode Switcher -->
        <div class="mode-switcher" data-testid="mode-switcher">
            <a href="typingtest1min.html" data-testid="switch-1min">1 Minute</a>
            <span>|</span>
            <a href="typingtest2min.html" data-testid="switch-2min">2 Minutes</a>
            <span>|</span>
            <a href="typingtest5min.html" data-testid="switch-5min">5 Minutes</a>
            <span>|</span>
            <a href="typingtestp3min.html" class="btn-secondary" style="border: 1px solid var(--secondary); padding: 4px 12px; border-radius: 6px;" data-testid="switch-punctuation">+ Punctuation</a>
        </div>
    </main>

    <script src="typing3min.js" defer></script>
</body>
</html>
